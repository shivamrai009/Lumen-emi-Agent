[project]
name = "lumen-emi-agent"
version = "0.1.0"
description = "Voice AI bot built with Pipecat"
# onnxruntime, a pipecat-ai dependency, has no Python 3.15 wheels yet.
requires-python = ">=3.11,<3.15"
dependencies = [
    "pipecat-ai[evals,groq,kokoro,mlx-whisper,runner,whisper,silero,webrtc]==1.16.0",
]

[dependency-groups]
dev = [
    "pyright>=1.1.404,<2",
    "pytest>=9.2.0",
    "ruff>=0.12.11,<1",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["I", "UP"]
